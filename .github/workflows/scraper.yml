name: AIS Windows Competitor Intelligence

on:
  workflow_dispatch:

  schedule:
    - cron: '0 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  scrape:
    name: Run Competitor Ad Scraper
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Scraper
        run: npm run scrape

      - name: Check for ads.json
        if: always()
        id: ads
        run: |
          if [ -f output/ads.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload ads.json
        if: always() && steps.ads.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ads-json
          path: output/ads.json
          retention-days: 30

      - name: Upload Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: assets/
          retention-days: 30
          if-no-files-found: ignore

      - name: Workflow Summary
        if: always()
        run: |
          echo "## AIS Windows Competitor Intelligence" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Workflow completed." >> $GITHUB_STEP_SUMMARY
          echo "- ads.json generated: ${{ steps.ads.outputs.exists }}" >> $GITHUB_STEP_SUMMARY
          echo "- Playwright executed successfully if no errors appear above." >> $GITHUB_STEP_SUMMARY
